configuration:
  workgroup:
    name: Workgroup
    description: Windows workgroup name (default WORKGROUP)
  nas_name:
    name: NAS Name
    description: NetBIOS / mDNS hostname shown in network browsers (default SimpleNAS)
  log_level:
    name: Log Level
    description: Samba log verbosity
  web_port:
    name: Web GUI Port
    description: Port for the web interface (default 8100). Note - if you change this the HA Ingress 'Open' button may not work. Access the GUI directly via http://YOUR-HA-IP:PORT instead.
  admin_password_enabled:
    name: Enable Admin Password Protection
    description: Protects the web interface with a username and password. Also requires setting admin_username and admin_password.
  admin_username:
    name: Admin Username
    description: Username for accessing the web interface (default admin). Only active when admin_password_enabled is true.
  admin_password:
    name: Admin Password
    description: Password for accessing the web interface. Stored encrypted. Only active when admin_password_enabled is true.
  smb_port:
    name: SMB Port
    description: SMB port (default 445). Change to e.g. 4445 if the official Samba add-on is also running.
  web_gui_enabled:
    name: Enable Web GUI
    description: Set to false to run Samba only, without the web interface (smaller attack surface).
  hdd_idle_seconds:
    name: HDD Spindown (seconds)
    description: Spin down mounted drives after this many seconds of inactivity to save power and reduce noise/wear (0 = disabled). Uses I/O-based hd-idle, suitable for USB drives. Only affects drives you mounted in Simple NAS, never the HA system disk. Note - any process touching the share (Samba client, SMART polling, backup jobs) resets the timer.
  file_allowed_roots:
    name: Allowed folders
    description: Directories the file manager may open. Anything outside is refused. Only change this if you need to manage files outside the default folders.
  sharing_enabled:
    name: Enable web sharing
    description: Starts the public sharing site on its own port (arrives with the next release). Requires an admin password to be set.
  share_port:
    name: Sharing site port
    description: Port the public sharing site listens on (default 8101). Publish this port through Nginx Proxy Manager with a domain and TLS.
  share_bind:
    name: Sharing site listens on
    description: 0.0.0.0 = reachable on the network (required when Nginx Proxy Manager runs as an add-on - it cannot reach the host loopback). 127.0.0.1 = only for a reverse proxy running directly on the host.
  share_public_url:
    name: Public address
    description: The address the sharing site is reachable at from outside, e.g. https://files.example.com. Used in the generated links.
  share_allowed_roots:
    name: Folders allowed for sharing
    description: Only folders below these directories can be shared via link. /config and /data are always excluded.
  share_trusted_proxies:
    name: Trusted proxies
    description: "X-Forwarded-For/-Proto are only honoured from these addresses. Default: localhost and the Supervisor network (where Nginx Proxy Manager runs as an add-on)."
  share_cookie_secure:
    name: Share cookie over HTTPS only
    description: Keep on when the site is published over HTTPS (the normal case). Only switch off for testing over http://.
  share_session_hours:
    name: Share site session length (hours)
    description: How long a login to a link stays valid.
  share_log_max_mb:
    name: Access log size (MB)
    description: The log rotates at this size; one older copy is kept.
  share_zip_max_gb:
    name: "ZIP download: maximum size (GB)"
    description: "Folders above this size are not offered as ZIP. Applies to the share site and the file manager."
  share_zip_max_files:
    name: "ZIP download: maximum file count"
    description: "Folders with more files are not offered as ZIP."
  share_zip_compress:
    name: "Compress ZIPs"
    description: "Off = store only (fast; photos and videos do not shrink anyway). On = deflate, noticeably CPU-heavy on small boards."
  share_max_upload_mb:
    name: "Upload: maximum file size (MB)"
    description: "Largest single file that may be uploaded through a link. Uploads are buffered on the data partition before processing - keep enough free space."
  share_upload_blocked_ext:
    name: "Upload: blocked file extensions"
    description: "These extensions are rejected, also in the middle of a name (x.html.txt). Executables, and HTML/SVG that would be served from your own server."
  share_upload_allowed_ext:
    name: "Upload: allowed file extensions (optional)"
    description: "If set, only these extensions are accepted, e.g. jpg, png, pdf. Empty = everything except the blocked ones."
  share_clamav_enabled:
    name: "Virus scan on upload"
    description: "Uploaded files are handed to the ClamAV add-on (clamd) and rejected on a hit. The Sharing tab has a test button."
  share_clamav_host:
    name: "clamd address"
    description: "Address of clamd. The ClamAV add-on on the host network is reachable at 127.0.0.1."
  share_clamav_port:
    name: "clamd port"
    description: "TCP port of clamd (default 3310). The TCP socket must be enabled in the ClamAV add-on."
  share_clamav_timeout:
    name: "Virus scan: time limit (seconds)"
    description: "Longest wait for a result per file."
  share_clamav_on_error:
    name: "Virus scanner unreachable"
    description: "reject = refuse the upload when clamd does not answer (recommended). accept = accept anyway and note it in the log."
  share_clamav_large_file:
    name: "File too large to scan"
    description: "clamd scans streams only up to its StreamMaxLength (25 MB by default); path mode is tried next. If that fails too: accept or reject."
