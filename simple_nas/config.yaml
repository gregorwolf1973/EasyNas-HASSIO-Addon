name: "Simple NAS"
description: "Simple NAS with Samba shares and web GUI for drive management"
version: "3.7.4"
url: "https://github.com/gregorwolf1973/EasyNas-HASSIO-Addon"
slug: "simple_nas"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
ingress: true
ingress_port: 8100
panel_icon: "mdi:nas"
panel_title: "Simple NAS"
host_network: true
ports:
  8101/tcp: 8101
ports_description:
  8101/tcp: "Public file-sharing site - publish only through a reverse proxy with TLS (Nginx Proxy Manager)"
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
  - DAC_READ_SEARCH
full_access: true
apparmor: false
options:
  workgroup: "WORKGROUP"
  nas_name: "SimpleNAS"
  log_level: "info"
  web_port: 8100
  admin_password_enabled: false
  admin_username: "admin"
  admin_password: ""
  smb_port: 445
  web_gui_enabled: true
  hdd_idle_seconds: 0
  file_allowed_roots:
    - "/media"
    - "/mnt"
    - "/share"
    - "/config"
    - "/addon_configs"
  sharing_enabled: false
  share_port: 8101
  share_bind: "0.0.0.0"
  share_public_url: ""
  share_allowed_roots:
    - "/media"
    - "/mnt"
    - "/share"
  share_trusted_proxies:
    - "127.0.0.1"
    - "::1"
    - "172.30.32.0/23"
  share_cookie_secure: true
  share_session_hours: 8
  share_log_max_mb: 5
  share_zip_max_gb: 5
  share_zip_max_files: 10000
  share_zip_compress: false
  share_max_upload_mb: 1024
  share_upload_blocked_ext:
    - exe
    - com
    - bat
    - cmd
    - scr
    - pif
    - msi
    - vbs
    - vbe
    - js
    - jse
    - jar
    - ps1
    - sh
    - lnk
    - hta
    - cpl
    - reg
    - dll
    - so
    - php
    - phtml
    - phar
    - html
    - htm
    - xhtml
    - shtml
    - svg
  share_upload_allowed_ext: []
  share_clamav_enabled: false
  share_clamav_host: "127.0.0.1"
  share_clamav_port: 3310
  share_clamav_timeout: 120
  share_clamav_on_error: "reject"
  share_clamav_large_file: "accept"
  share_log_export_path: ""
schema:
  workgroup: str
  nas_name: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  web_port: port
  admin_password_enabled: bool
  admin_username: str
  admin_password: str
  smb_port: port
  web_gui_enabled: bool
  hdd_idle_seconds: int(0,)
  file_allowed_roots:
    - "str?"
  sharing_enabled: bool
  share_port: port?
  share_bind: list(0.0.0.0|127.0.0.1)?
  share_public_url: str?
  share_allowed_roots:
    - "str?"
  share_trusted_proxies:
    - "str?"
  share_cookie_secure: bool?
  share_session_hours: int(1,720)?
  share_log_max_mb: int(1,100)?
  share_zip_max_gb: int(1,512)?
  share_zip_max_files: int(100,1000000)?
  share_zip_compress: bool?
  share_max_upload_mb: int(1,102400)?
  share_upload_blocked_ext:
    - "str?"
  share_upload_allowed_ext:
    - "str?"
  share_clamav_enabled: bool?
  share_clamav_host: str?
  share_clamav_port: port?
  share_clamav_timeout: int(5,3600)?
  share_clamav_on_error: list(reject|accept)?
  share_clamav_large_file: list(reject|accept)?
  share_log_export_path: str?
map:
  - share:rw
  - media:rw
  - ssl:rw
  - config:rw
  - all_addon_configs:rw
